  <style>
/* AI Use Case Sandbox: visual language matches the EIS AI Strategy Development
   Facilitation App (Oregon Enterprise Information Services): dark teal header with logo,
   EIS blue actions, green accents, flat gray page. Colors sampled from the live app. */

:root {
  --ink: #222222;
  --muted: #55606a;
  --line: #d3dae0;
  --paper: #ffffff;
  --soft: #f4f6f8;
  --page: #eff1f3;
  --header: #173f56;
  --blue: #0f75b0;
  --blue-dark: #0b5d8e;
  --navy: #173f56;
  --navy-text: #173f56;
  --teal: #375e4c;
  --pill-bg: #ecf5f2;
  --pill-line: #92a59c;
  --btn-soft: #e6ecf1;
  --gold: #986b17;
  --green: #375e4c;
  --red: #8f2f22;
  --shadow: 0 10px 30px rgba(23, 63, 86, 0.10);
  --shadow-sm: 0 4px 16px rgba(23, 63, 86, 0.07);
  --radius: 6px;
  --font: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  color: var(--ink);
  line-height: 1.5;
  background: var(--page);
}

button, textarea, input, select { font: inherit; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }

.skip-link {
  position: absolute; left: 8px; top: -64px; z-index: 40; background: var(--navy); color: #fff;
  font-weight: 700; padding: 10px 14px; border-radius: 0 0 6px 6px; text-decoration: none; transition: top 0.15s ease;
}
.skip-link:focus { top: 0; }

/* --- Header ------------------------------------------------------------ */

header.app-header {
  display: flex; align-items: center; gap: 16px 28px; flex-wrap: wrap;
  padding: 26px clamp(16px, 4vw, 44px) 24px;
  background: var(--header); color: #fff; border-top: 8px solid var(--blue);
}
.brand-row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.brand-logo { height: 64px; width: auto; display: block; }
header.app-header .brand { font-size: clamp(1.4rem, 2.6vw, 2.3rem); font-weight: 700; line-height: 1.1; color: #fff; }
header.app-header .tagline { flex: 1 0 100%; order: 3; margin: 0; font-size: 1.05rem; color: #fff; }
header.app-header .ws-name { margin-left: auto; font-size: 0.95rem; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 10px; }
header.app-header button.linkish {
  background: #fff; border: 1px solid #fff; color: var(--navy-text);
  border-radius: var(--radius); padding: 8px 14px; font-size: 0.88rem; font-weight: 700; cursor: pointer; min-height: 40px;
}
header.app-header button.linkish:hover { background: var(--btn-soft); }
header.app-header :focus-visible { outline-color: #fff; }

/* --- Nav tabs ----------------------------------------------------------- */

nav.tabs {
  width: min(1480px, 100% - 2 * clamp(12px, 2vw, 28px)); margin: 18px auto 0;
  display: flex; gap: 1px; overflow-x: auto;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
nav.tabs button {
  flex: 1 1 0; min-height: 52px; padding: 8px 14px; background: var(--soft); color: #2b3a46; border: 0;
  font-size: 0.95rem; font-weight: 600; cursor: pointer; white-space: nowrap;
}
nav.tabs button:hover { background: #e9eef2; }
nav.tabs button.active { background: var(--blue); color: #fff; }
nav.tabs button:focus-visible { outline-offset: -3px; outline-color: var(--navy); }
nav.tabs[hidden] { display: none; }

/* --- Layout -------------------------------------------------------------- */

main { width: min(1480px, 100%); margin: 0 auto; padding: 18px clamp(12px, 2vw, 28px) 28px; }
main:focus { outline: none; }
.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 20px 24px; margin-bottom: 18px;
}
.card h2 { margin: 0 0 6px; font-size: clamp(1.25rem, 2vw, 1.9rem); line-height: 1.15; color: var(--ink); }
.card h3 { margin: 18px 0 8px; font-size: 1rem; color: var(--navy-text); }
.card .lead { color: var(--muted); margin: 0 0 14px; font-size: 0.95rem; line-height: 1.47; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 780px) { .grid-2 { grid-template-columns: 1fr; } }

/* --- Buttons & forms ------------------------------------------------------ */

button.primary, button.secondary, button.subtle, a.btnlike {
  min-height: 44px; border-radius: var(--radius); padding: 9px 16px; font-size: 0.92rem; font-weight: 700; cursor: pointer;
  border: 1px solid transparent; font-family: inherit; text-decoration: none; display: inline-flex;
  align-items: center; justify-content: center; gap: 8px; transition: transform 0.16s ease, box-shadow 0.16s ease;
}
button.primary { background: var(--blue); color: #fff; }
button.primary:hover { background: var(--blue-dark); }
button.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(15, 117, 176, 0.22); }
button.primary:disabled { background: #9fb2c5; cursor: not-allowed; transform: none; box-shadow: none; }
button.secondary, a.btnlike { background: var(--btn-soft); color: var(--navy-text); }
button.secondary:hover, a.btnlike:hover { background: #d8e1e8; }
button.subtle { background: #fff; color: var(--navy-text); border-color: #b6c2cf; }
button.subtle:hover { background: var(--soft); }
button.danger-subtle { background: none; border: none; color: var(--red); cursor: pointer; font-size: 0.85rem; font-weight: 700; min-height: 36px; padding: 4px 8px; }

input[type="text"], textarea, select {
  width: 100%; padding: 10px 11px; min-height: 44px; border: 1px solid #8d9aa8; border-radius: var(--radius);
  font-size: 0.95rem; color: var(--ink); background: #fff; line-height: 1.45;
}
input[type="text"]:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
textarea { resize: vertical; min-height: 96px; }
::placeholder { color: var(--muted); opacity: 1; }
label.field-label { display: block; font-weight: 700; margin: 14px 0 4px; font-size: 0.88rem; color: #263545; }
.help-text { color: var(--muted); font-size: 0.82rem; line-height: 1.35; margin: 3px 0 8px; }

/* --- Status pills & progress ------------------------------------------------ */

.pill { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 5px 14px; border-radius: var(--radius); font-size: 0.85rem; font-weight: 600; white-space: nowrap; background: var(--pill-bg); color: var(--green); border: 1px solid var(--pill-line); }
.pill.not_started { background: var(--pill-bg); color: var(--green); }
.pill.needs_input { background: #fff3d6; color: #6e4d0f; border-color: #d9c28a; }
.pill.complete { background: var(--green); color: #fff; border-color: var(--green); }

.progress-wrap { height: 10px; border-radius: 999px; background: #e6edf4; overflow: hidden; }
.progress-bar { height: 100%; min-width: 4px; border-radius: inherit; background: var(--green); transition: width 0.28s ease; }

/* --- Rows (dashboard / home lists) ----------------------------------------- */

.section-row { display: flex; align-items: center; gap: 14px; padding: 12px 8px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
.section-row:hover { background: var(--soft); }
.section-row:last-child { border-bottom: none; }
.section-row .num {
  background: var(--header); color: #fff; border-radius: var(--radius); width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 800; flex-shrink: 0;
}
.section-row .title { flex: 1; font-weight: 700; font-size: 0.95rem; color: var(--navy-text); }
.section-row .title small { display: block; font-weight: 400; color: var(--muted); font-size: 0.82rem; }

/* --- Choice chips ------------------------------------------------------------ */

.choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.choices button.chip {
  min-height: 36px; border: 1px solid #b9c6d3; background: #edf3f9; border-radius: 999px;
  padding: 7px 12px; font-size: 0.84rem; font-weight: 700; cursor: pointer; color: #25384b;
}
.choices button.chip:hover { border-color: var(--blue); }
.choices button.chip.selected { background: var(--blue); border-color: var(--blue); color: #fff; }

/* --- Misc ----------------------------------------------------------------------- */

.flex-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.notice { padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; margin: 10px 0; line-height: 1.43; }
.notice.info { background: #eaf1f9; color: var(--navy-text); border-left: 4px solid var(--blue); }
.notice.warn { background: #fff9ea; color: #4d3a13; border-left: 4px solid var(--gold); }
.notice.good { background: var(--pill-bg); color: var(--green); border-left: 4px solid var(--green); }
.doc-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.doc-item:last-child { border-bottom: none; }
.doc-item .meta { flex: 1; min-width: 200px; }
.doc-item .meta .name { font-weight: 700; font-size: 0.93rem; color: var(--navy-text); }
.doc-item .meta .sub { color: var(--muted); font-size: 0.82rem; }
.save-flash { font-size: 0.8rem; font-weight: 700; color: var(--green); transition: opacity 0.5s; min-height: 1.2em; }
.empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }
.empty-state .big { font-size: 2.4rem; margin-bottom: 8px; }
footer.app-footer {
  padding: 14px clamp(16px, 3vw, 38px); border-top: 1px solid var(--line); background: #fff;
  color: var(--muted); font-size: 0.85rem; line-height: 1.4; text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  button.primary:hover { transform: none; }
}

</style>
  <style>
/* AI Use Case Sandbox: screen-specific styles, on the EIS palette in styles.css. */

[hidden] { display: none !important; }

/* Phase tabs (Use Cases screen), numbered like the Socratic Sandbox */
.phase-stepper {
  display: grid; grid-template-columns: repeat(5, minmax(60px, 1fr)); gap: 1px; margin-top: 14px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
}
.phase-stepper button {
  position: relative; min-height: 72px; padding: 10px 5px; display: grid; place-items: center; gap: 2px; text-align: center;
  background: var(--soft); color: #2b3a46; border: 0; cursor: pointer;
}
.phase-stepper button strong { font-size: 1.25rem; font-weight: 600; }
.phase-stepper button span { color: var(--muted); font-size: 0.85rem; line-height: 1.05; }
.phase-stepper button.done::after { content: "\2713"; position: absolute; top: 6px; right: 12px; color: var(--green); font-weight: 700; font-size: 0.95rem; }
.phase-stepper button:hover { background: #e9eef2; }
.phase-stepper button.active { background: var(--blue); color: #fff; }
.phase-stepper button.active span { color: rgba(255, 255, 255, 0.94); }
.phase-stepper button.active.done::after { color: #fff; }
.phase-stepper button:focus-visible { outline-offset: -3px; outline-color: var(--navy); }
@media (max-width: 720px) { .phase-stepper { display: flex; overflow-x: auto; } .phase-stepper button { min-width: 76px; } }

/* Use case screen: workspace plus sticky capture panel */
.with-aside { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 0.42fr); gap: 18px; align-items: start; }
@media (max-width: 1060px) { .with-aside { grid-template-columns: 1fr; } }
.capture { position: sticky; top: 16px; max-height: calc(100vh - 32px); display: grid; grid-template-rows: auto 1fr auto; padding: 0; overflow: hidden; margin-bottom: 18px; }
@media (max-width: 1060px) { .capture { position: static; max-height: none; } }
.capture-head { padding: 16px; border-bottom: 1px solid var(--line); background: var(--soft); }
.capture-head h2 { font-size: 1.08rem; margin: 0; }
.capture-head p { margin: 5px 0 8px; color: var(--muted); font-size: 0.9rem; }
.capture-scroll { overflow: auto; padding: 14px; display: grid; gap: 11px; align-content: start; }
.capture-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: #fff; }
.capture-item.current { border-color: var(--blue); background: #f5fafd; }
.capture-item h3 { margin: 0 0 7px; font-size: 0.94rem; color: var(--navy-text); }
.capture-item p { margin: 0; color: #2b3b4b; font-size: 0.9rem; line-height: 1.42; white-space: pre-wrap; }
.capture-actions { padding: 13px; border-top: 1px solid var(--line); background: var(--soft); display: flex; gap: 10px; flex-wrap: wrap; }

/* Phase header */
.kicker { margin: 0 0 6px; color: var(--green); font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }

/* The three steps */
.step { border-left: 4px solid var(--blue); }
.step .step-tag { display: block; margin-bottom: 8px; color: var(--blue); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
.step.interrogate { border-left-color: var(--gold); }
.step.interrogate .step-tag { color: var(--gold); }
.step.consensus { border-left-color: var(--green); }
.step.consensus .step-tag { color: var(--green); }
.step > .lead { border-left: 0; }

.prompt-box {
  font-family: var(--font); font-size: 0.9rem; line-height: 1.44; color: #25384b; min-height: 154px;
  border-color: #c6d0da; background: #f7fafc;
}

/* Idea board */
.bucket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.bucket { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--soft); }
.bucket h4 { margin: 0 0 2px; color: var(--navy-text); font-size: 0.95rem; }
.idea { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.idea:last-of-type { border-bottom: none; }
.idea label { flex: 1; cursor: pointer; }
.idea.promoted label { color: var(--muted); }
.idea input[type=checkbox] { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--blue); }
.add-idea { display: flex; gap: 6px; margin-top: 8px; }
.add-idea input { flex: 1; }

.risk-list { margin: 6px 0 0; padding-left: 1.2em; font-size: 0.85rem; color: var(--muted); }
details.hint { margin: 10px 0; font-size: 0.88rem; }
details.hint summary { cursor: pointer; color: var(--blue); font-weight: 700; }
.uc-meter { width: 130px; }

</style>
</head>

const filled = (s) => !!(s && String(s).trim());

function phaseState(phase, uc) {
  return phase.scope === 'workspace' ? state.ws.phase1 : uc.phases[phase.id];
}
function phaseDone(phase, uc) { return filled(phaseState(phase, uc).consensus); }
function ucProgress(uc) { return ucPhases().filter((p) => phaseDone(p, uc)).length; }
function selectedIdeas() { return state.ws.ideas.filter((i) => i.selected).map((i) => i.text); }

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

function flashSaved(el) {
  if (!el) return;
  el.textContent = 'Saved';
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = 0; }, 1200);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) {}
  ta.remove();
  return ok;
}

async function reloadWorkspace() { state.ws = await api(wsUrl()); }

// Navigation

function go(screen) { state.screen = screen; render(); }

$main.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-export]');
  if (a && window.StandaloneApi) { e.preventDefault(); window.StandaloneApi.exportDoc(a.getAttribute('href')); }
});

$tabs.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-screen]');
  if (btn) go(btn.dataset.screen);
});

function render() {
  $tabs.hidden = !state.ws;
  for (const btn of $tabs.querySelectorAll('button')) btn.classList.toggle('active', btn.dataset.screen === state.screen);
  if (state.ws) {
    $headerWs.innerHTML = `<span>${esc(state.ws.teamName)}</span><button class="linkish" id="switch-ws">Switch workspace</button>`;
    document.getElementById('switch-ws').onclick = () => { state.ws = null; state.screen = 'home'; loadHome(); };
  } else {
    $headerWs.innerHTML = '';
  }
  const screens = { home: renderHome, dashboard: renderDashboard, ideas: renderIdeas, usecases: renderUseCases, export: renderExport };
  (screens[state.screen] || renderHome)();
  window.scrollTo(0, 0);
}

            <li>Every phase has the same three steps: <strong>Huddle</strong> (capture what you know), <strong>Interrogate</strong> (copy the prompt into your AI and let it poke holes), <strong>Consensus</strong> (record what you agree).</li>

async function openWorkspace(id, screen) {

        <div class="title">${esc(p1.title)}<small>${ws.ideas.length} idea${ws.ideas.length === 1 ? '' : 's'} on the board · ${ws.ideas.filter((i) => i.selected).length} ticked for interrogation</small></div>

async function promptNewUseCase() {
  const name = (window.prompt('Short name for the use case (you can rename it later):') || '').trim();
  if (!name) return;
  try {
    const [uc] = await api(wsUrl('/use-cases'), { method: 'POST', body: { name, userName: state.userName } });
    await reloadWorkspace();
    state.useCaseId = uc.id; state.phaseId = 'p2';
    go('usecases');
  } catch (e) { alert(e.message); }
}

// ---------------------------------------------------------------------------
// Phase panel (shared by Idea Board and Use Cases)
// ---------------------------------------------------------------------------

function promptKey(phase, uc) { return `${uc ? uc.id : 'ws'}:${phase.id}`; }

function generatedPrompt(phase, uc) {
  const st = phaseState(phase, uc);
  return Prompts.buildPrompt(phase.id, { team: state.ws.teamName, ideas: selectedIdeas(), fields: st.fields, uc });
}

function renderField(f, value) {
  const label = `<label class="field-label" for="f-${f.id}">${esc(f.label)}</label>${f.help ? `<div class="help-text">${esc(f.help)}</div>` : ''}`;
  if (f.type === 'text') return `${label}<input type="text" id="f-${f.id}" data-field="${f.id}" value="${esc(value || '')}" placeholder="${esc(f.placeholder || '')}">`;
  if (f.type === 'chips') {
    const sel = Array.isArray(value) ? value : [];
    return `${label}<div class="choices" data-chips="${f.id}">${f.options.map((o) =>
      `<button type="button" class="chip${sel.includes(o) ? ' selected' : ''}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  return `${label}<textarea id="f-${f.id}" data-field="${f.id}" rows="${f.rows || 4}">${esc(value || '')}</textarea>`;
}

function tickMessage(n) {
  return n > 4 ? `${n} ideas ticked. Three or four gets sharper questions from the AI.` : 'Tick the ideas you want to interrogate on the board above.';
}

function renderIdeaBoard() {
  const ws = state.ws;
  return `<div class="bucket-grid">${state.template.buckets.map((b) => {
    const items = ws.ideas.filter((i) => i.bucket === b.id);
    return `<div class="bucket">
      <h4>${esc(b.label)}</h4><div class="help-text">${esc(b.help)}</div>
      ${items.map((i) => `<div class="idea${i.promoted ? ' promoted' : ''}">
          <input type="checkbox" id="chk-${esc(i.id)}" data-idea="${esc(i.id)}" ${i.selected ? 'checked' : ''}>
          <label for="chk-${esc(i.id)}">${esc(i.text)}${i.promoted ? ' <span class="pill complete">use case</span>' : ''}</label>
          <button class="danger-subtle" data-del-idea="${esc(i.id)}" title="Remove">✕</button>
        </div>`).join('')}
      <div class="add-idea"><input type="text" data-add-bucket="${b.id}" placeholder="Add a process…"><button class="secondary" data-add-btn="${b.id}">Add</button></div>
    </div>`;
  }).join('')}</div>`;
}

function renderPhasePanel(phase, uc) {
  const st = phaseState(phase, uc);
  const key = promptKey(phase, uc);
  const promptText = key in state.promptEdits ? state.promptEdits[key] : generatedPrompt(phase, uc);
  const ticked = selectedIdeas().length;

  const huddleBody = phase.scope === 'workspace'
    ? renderIdeaBoard()
    : phase.huddle.fields.map((f) => renderField(f, st.fields[f.id])).join('') +
      (phase.huddle.prompts ? `<details class="hint"><summary>Questions to prompt your thinking</summary><ul class="risk-list">${phase.huddle.prompts.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></details>` : '');

  const earlier = phase.id === 'p4' || phase.id === 'p5' || phase.id === 'p6';
  const missingP3 = earlier && !phaseDone(phaseDef('p3'), uc)
    ? `<div class="notice warn">Phase 3 has no agreed AI opportunity yet, so this prompt has a gap. Finish Phase 3's consensus first for a better result.</div>` : '';
  const p1Note = phase.id === 'p1' ? `<div class="notice ${ticked > 4 ? 'warn' : 'info'}" id="tick-note" ${ticked >= 1 && ticked <= 4 ? 'hidden' : ''}>${tickMessage(ticked)}</div>` : '';

  const idx = ucPhases().findIndex((p) => p.id === phase.id);
  const nextPhase = uc && idx >= 0 && idx < ucPhases().length - 1 ? ucPhases()[idx + 1] : null;

  return `
    <div class="card">
      <div class="flex-between" style="align-items:flex-start">
        <div>
          <p class="kicker">Phase ${phase.number} of 6 · ${esc(phase.short)}</p>
          <h2>${esc(phase.title)}</h2>
          <p class="lead" style="margin:6px 0 0;max-width:820px">${esc(phase.goal)}</p>
        </div>
        <span class="pill ${filled(st.consensus) ? 'complete' : 'not_started'}" id="phase-pill" aria-live="polite">${filled(st.consensus) ? 'Agreed' : 'Not yet agreed'}</span>
      </div>
    </div>

    <div class="card step huddle">
      <span class="step-tag">Step 1 · Huddle</span>
      <p class="lead">${esc(phase.huddle.intro)}</p>
      ${huddleBody}
      <div class="save-flash" id="flash-fields" style="opacity:0"></div>
    </div>

    <div class="card step interrogate">
      <span class="step-tag">Step 2 · Interrogate</span>
      <p class="lead">${esc(phase.interrogate.intro)}</p>
      ${p1Note}${missingP3}
      <label class="field-label" for="prompt-box">Prompt <span style="font-weight:400;color:var(--muted)">(built from your Step 1 answers; edit freely)</span></label>
      <textarea id="prompt-box" class="prompt-box">${esc(promptText)}</textarea>
      <div class="btn-row">
        <button class="primary" id="copy-prompt">Copy prompt</button>
        <button class="secondary" id="copy-primer">Copy "story so far"</button>
        <button class="subtle" id="reset-prompt" ${key in state.promptEdits ? '' : 'hidden'}>Reset to generated prompt</button>
        <span class="save-flash" id="flash-copy" style="opacity:0;align-self:center"></span>
      </div>
      <div class="help-text">Paste the prompt into your approved AI tool and keep going in the same conversation. If you start a fresh chat, paste the "story so far" first so it knows what you have already agreed.</div>
      <label class="field-label" for="pasted">The AI's response <span style="font-weight:400;color:var(--muted)">(paste it here to keep it with your notes)</span></label>
      <textarea id="pasted" rows="9" placeholder="Paste the response here, including any follow-up exchanges worth keeping.">${esc(st.pasted)}</textarea>
      <div class="save-flash" id="flash-pasted" style="opacity:0"></div>
    </div>

    <div class="card step consensus">
      <span class="step-tag">Step 3 · Consensus</span>
      <label class="field-label" for="consensus" style="margin-top:0">${esc(phase.consensus.label)}</label>
      <div class="help-text">${esc(phase.consensus.help)}</div>
      <textarea id="consensus" rows="7">${esc(st.consensus)}</textarea>
      <div class="save-flash" id="flash-consensus" style="opacity:0"></div>
      <div class="btn-row">
        ${phase.id === 'p1' ? `<button class="primary" id="promote">Promote ticked ideas to use cases</button>` : ''}
        ${nextPhase ? `<button class="primary" id="next-phase">Continue to Phase ${nextPhase.number} →</button>` : ''}
        ${uc && !nextPhase ? `<button class="primary" id="to-export">Go to Export Center →</button>` : ''}
      </div>
    </div>`;
}

function bindPhasePanel(phase, uc) {
  const st = phaseState(phase, uc);
  const key = promptKey(phase, uc);
  const body = (extra) => ({ ...(uc ? { useCaseId: uc.id } : {}), userName: state.userName, ...extra });
  const put = (extra) => api(wsUrl(`/phases/${phase.id}`), { method: 'PUT', body: body(extra) });
  const $prompt = document.getElementById('prompt-box');

  const refreshPrompt = () => {
    if (key in state.promptEdits) return;
    $prompt.value = generatedPrompt(phase, uc);
  };

  // Huddle fields (phases 2-6)
  if (phase.scope === 'usecase') {
    const saveFields = debounce(async () => {
      try { st.fields = await put({ fields: st.fields }).then((s) => s.fields); flashSaved(document.getElementById('flash-fields')); } catch (e) { alert(e.message); }
    }, 600);
    for (const el of $main.querySelectorAll('[data-field]')) {
      el.addEventListener('input', () => { st.fields[el.dataset.field] = el.value; refreshPrompt(); saveFields(); });
    }
    for (const group of $main.querySelectorAll('[data-chips]')) {
      group.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip'); if (!chip) return;
        chip.classList.toggle('selected');
        st.fields[group.dataset.chips] = [...group.querySelectorAll('.chip.selected')].map((c) => c.dataset.val);
        refreshPrompt(); saveFields();
      });
    }
  } else {
    bindIdeaBoard(refreshPrompt);
  }

  // Prompt editing
  $prompt.addEventListener('input', () => {
    state.promptEdits[key] = $prompt.value;
    document.getElementById('reset-prompt').hidden = false;
  });
  document.getElementById('reset-prompt').onclick = () => {
    delete state.promptEdits[key];
    $prompt.value = generatedPrompt(phase, uc);
    document.getElementById('reset-prompt').hidden = true;
  };
  const flash = document.getElementById('flash-copy');
  const copyWith = async (text, label) => {
    const ok = await copyText(text);
    flashSaved(flash);
    flash.textContent = ok ? `${label} copied` : 'Copy failed. Select the text and copy it manually.';
  };
  document.getElementById('copy-prompt').onclick = () => copyWith($prompt.value, 'Prompt');
  document.getElementById('copy-primer').onclick = () => copyWith(Prompts.contextPrimer(state.ws.teamName, uc, uc ? [] : selectedIdeas()), '"Story so far"');

  // Pasted AI response + consensus
  const savePasted = debounce(async () => { await put({ pasted: st.pasted }); flashSaved(document.getElementById('flash-pasted')); }, 600);
  document.getElementById('pasted').addEventListener('input', (e) => { st.pasted = e.target.value; savePasted(); });
  const saveConsensus = debounce(async () => { await put({ consensus: st.consensus }); flashSaved(document.getElementById('flash-consensus')); refreshStepper(); }, 600);
  document.getElementById('consensus').addEventListener('input', (e) => {
    st.consensus = e.target.value;
    const pill = document.getElementById('phase-pill');
    pill.textContent = filled(st.consensus) ? 'Agreed' : 'Not yet agreed';
    pill.className = `pill ${filled(st.consensus) ? 'complete' : 'not_started'}`;
    saveConsensus();
  });

  const next = document.getElementById('next-phase');
  if (next) next.onclick = () => {
    const list = ucPhases(); state.phaseId = list[list.findIndex((p) => p.id === phase.id) + 1].id; render();
  };
  const toExport = document.getElementById('to-export');
  if (toExport) toExport.onclick = () => go('export');
  const promote = document.getElementById('promote');
  if (promote) promote.onclick = async () => {
    try {
      const made = await api(wsUrl('/use-cases'), { method: 'POST', body: { fromSelectedIdeas: true, userName: state.userName } });
      await reloadWorkspace();
      state.useCaseId = made[0].id; state.phaseId = 'p2';
      go('usecases');
    } catch (e) { alert(e.message); }
  };
}

function bindIdeaBoard(refreshPrompt) {
  const add = async (bucket) => {
    const input = $main.querySelector(`[data-add-bucket="${bucket}"]`);
    const text = input.value.trim(); if (!text) return;
    try {
      await api(wsUrl('/ideas'), { method: 'POST', body: { text, bucket, userName: state.userName } });
      await reloadWorkspace(); render();
      const again = $main.querySelector(`[data-add-bucket="${bucket}"]`); if (again) again.focus();
    } catch (e) { alert(e.message); }
  };
  for (const btn of $main.querySelectorAll('[data-add-btn]')) btn.onclick = () => add(btn.dataset.addBtn);
  for (const input of $main.querySelectorAll('[data-add-bucket]')) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(input.dataset.addBucket); });
  for (const chk of $main.querySelectorAll('[data-idea]')) {
    chk.addEventListener('change', async () => {
      const idea = state.ws.ideas.find((i) => i.id === chk.dataset.idea);
      idea.selected = chk.checked;
      await api(wsUrl(`/ideas/${idea.id}`), { method: 'PATCH', body: { selected: chk.checked, userName: state.userName } });
      refreshPrompt();
      const n = selectedIdeas().length, note = document.getElementById('tick-note');
      note.hidden = n >= 1 && n <= 4;
      note.className = `notice ${n > 4 ? 'warn' : 'info'}`;
      note.textContent = tickMessage(n);
    });
  }
  for (const del of $main.querySelectorAll('[data-del-idea]')) {
    del.onclick = async () => { await api(wsUrl(`/ideas/${del.dataset.delIdea}`), { method: 'DELETE' }); await reloadWorkspace(); render(); };
  }
}

// ---------------------------------------------------------------------------
// Idea Board and Use Cases screens
// ---------------------------------------------------------------------------

function renderIdeas() {
  const phase = phaseDef('p1');
  $main.innerHTML = renderPhasePanel(phase, null);
  bindPhasePanel(phase, null);
}

function stepperHtml(uc) {
  return `<div class="phase-stepper" id="stepper" role="group" aria-label="Phases">${ucPhases().map((p) => {
    const done = phaseDone(p, uc);
    return `<button type="button" data-phase="${p.id}" class="${p.id === state.phaseId ? 'active' : ''}${done ? ' done' : ''}" aria-current="${p.id === state.phaseId}" aria-label="Phase ${p.number}: ${esc(p.short)}${done ? ', agreed' : ', not yet agreed'}"><strong aria-hidden="true">${p.number}</strong><span aria-hidden="true">${esc(p.short)}</span></button>`;
  }).join('')}</div>`;
}

function captureItems(uc) {
  return ucPhases().map((p) => `<article class="capture-item${p.id === state.phaseId ? ' current' : ''}"><h3>${p.number}. ${esc(p.title)}</h3><p>${esc(phaseState(p, uc).consensus.trim() || 'Awaiting team consensus.')}</p></article>`).join('');
}

function captureHtml(uc) {
  const n = ucProgress(uc);
  return `<aside class="card capture" aria-label="Use case capture">
    <div class="capture-head"><h2>Use Case Capture</h2><p id="capture-count" aria-live="polite">${n} of 5 phases agreed.</p><div class="progress-wrap"><div class="progress-bar" id="capture-bar" style="width:${n * 20}%"></div></div></div>
    <div class="capture-scroll" id="capture-items" role="region" aria-label="Agreed phase text" tabindex="0">${captureItems(uc)}</div>
    <div class="capture-actions"><a class="btnlike" data-export href="${wsUrl(`/export/brief?useCaseId=${uc.id}`)}" target="_blank">Open brief</a><a class="btnlike" data-export href="${wsUrl(`/export/brief?useCaseId=${uc.id}&format=doc`)}">Export Word</a></div>
  </aside>`;
}

function refreshStepper() {
  const uc = currentUc(); const el = document.getElementById('stepper');
  if (!uc || !el) return;
  el.outerHTML = stepperHtml(uc);
  bindStepper();
  const n = ucProgress(uc);
  document.getElementById('capture-count').textContent = `${n} of 5 phases agreed.`;
  document.getElementById('capture-bar').style.width = `${n * 20}%`;
  document.getElementById('capture-items').innerHTML = captureItems(uc);
}

function bindStepper() {
  for (const btn of $main.querySelectorAll('#stepper [data-phase]')) btn.onclick = () => { state.phaseId = btn.dataset.phase; render(); };
}

function renderUseCases() {
  const ws = state.ws;
  const ucs = Object.values(ws.useCases);
  if (!ucs.length) {
    $main.innerHTML = `<div class="card"><div class="empty-state"><div class="big">🧭</div>No use cases yet.<div class="btn-row" style="justify-content:center">
      <button class="primary" id="goto-ideas">Go to the Idea Board</button><button class="secondary" id="new-uc">+ New use case</button></div></div></div>`;
    document.getElementById('goto-ideas').onclick = () => go('ideas');
    document.getElementById('new-uc').onclick = promptNewUseCase;
    return;
  }
  if (!ws.useCases[state.useCaseId]) state.useCaseId = ucs[0].id;
  const uc = currentUc();
  if (phaseDef(state.phaseId).scope !== 'usecase') state.phaseId = 'p2';
  const phase = phaseDef(state.phaseId);

  $main.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <div style="flex:1;min-width:240px">
          <label class="field-label" for="uc-select" style="margin-top:0">Use case</label>
          <select id="uc-select">${ucs.map((u) => `<option value="${esc(u.id)}" ${u.id === uc.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
        </div>
        <div class="btn-row" style="margin:0"><button class="secondary" id="new-uc">+ New</button><button class="subtle" id="rename-uc">Rename</button><button class="danger-subtle" id="delete-uc">Delete</button></div>
      </div>
      ${stepperHtml(uc)}
    </div>
    <div class="with-aside"><div>${renderPhasePanel(phase, uc)}</div>${captureHtml(uc)}</div>`;

  document.getElementById('uc-select').onchange = (e) => { state.useCaseId = e.target.value; render(); };
  document.getElementById('new-uc').onclick = promptNewUseCase;
  document.getElementById('rename-uc').onclick = async () => {
    const name = (window.prompt('New name:', uc.name) || '').trim(); if (!name) return;
    await api(wsUrl(`/use-cases/${uc.id}`), { method: 'PATCH', body: { name, userName: state.userName } });
    await reloadWorkspace(); render();
  };
  document.getElementById('delete-uc').onclick = async () => {
    if (!confirm(`Delete "${uc.name}" and everything recorded for it?`)) return;
    await api(wsUrl(`/use-cases/${uc.id}`), { method: 'DELETE' });
    await reloadWorkspace(); state.useCaseId = null; render();
  };
  bindStepper();
  bindPhasePanel(phase, uc);
}

// ---------------------------------------------------------------------------
// Export Center
// ---------------------------------------------------------------------------

function renderExport() {
  const ws = state.ws;
  const ucs = Object.values(ws.useCases);
  const rows = ucs.map((uc) => `
    <div class="doc-item"><div class="meta"><div class="name">${esc(uc.name)}</div><div class="sub">${ucProgress(uc)} of 5 phases agreed</div></div>
      <a class="btnlike" data-export href="${wsUrl(`/export/brief?useCaseId=${uc.id}`)}" target="_blank">View / print</a>
      <a class="btnlike" data-export href="${wsUrl(`/export/brief?useCaseId=${uc.id}&format=doc`)}">Word</a>
      <a class="btnlike" data-export href="${wsUrl(`/export/brief?useCaseId=${uc.id}&format=md`)}">Markdown</a></div>`).join('');
  $main.innerHTML = `
    <div class="card">
      <h2>Use case briefs</h2>
      <p class="lead">One page per use case: process, AI opportunity, data readiness, risks, and intended outcomes. Open it and print or save as PDF from your browser.</p>
      ${rows || '<div class="empty-state">No use cases yet.</div>'}
    </div>
    <div class="card">
      <h2>Portfolio</h2>
      <p class="lead">All use cases side by side, plus the ideas still on the shelf. Good for a leadership conversation about what to pursue first.</p>
      <div class="btn-row" style="margin-top:0"><a class="btnlike" data-export href="${wsUrl('/export/portfolio')}" target="_blank">View / print</a><a class="btnlike" data-export href="${wsUrl('/export/portfolio?format=doc')}">Word</a><a class="btnlike" data-export href="${wsUrl('/export/portfolio?format=md')}">Markdown</a></div>
    </div>`;
}

// ---------------------------------------------------------------------------

(async function init() {
  state.template = await api('/api/template');
  await loadHome();
})();

  </script>
</body>
